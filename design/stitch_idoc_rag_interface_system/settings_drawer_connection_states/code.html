<script>
  function selectSource(id) {
    const card1 = document.getElementById('card-s1');
    const card2 = document.getElementById('card-s2');
    
    if (id === 's1') {
      card1.classList.remove('opacity-85');
      card1.querySelector('.absolute').classList.replace('bg-outline-variant', 'bg-primary-container');
      card2.classList.add('opacity-85');
      card2.querySelector('.absolute').classList.replace('bg-primary-container', 'bg-outline-variant');
      card1.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } else {
      card2.classList.remove('opacity-85');
      card2.querySelector('.absolute').classList.replace('bg-outline-variant', 'bg-primary-container');
      card1.classList.add('opacity-85');
      card1.querySelector('.absolute').classList.replace('bg-primary-container', 'bg-outline-variant');
      card2.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function focusSources() {
    const drawer = document.getElementById('sources-drawer');
    drawer.classList.remove('hidden');
    drawer.scrollIntoView({ behavior: 'smooth' });
  }

  function toggleDrawer() {
    const drawer = document.getElementById('sources-drawer');
    drawer.classList.toggle('hidden');
  }

  function copyResponse() {
    const icon = document.getElementById('copy-icon');
    const text = document.getElementById('copy-text');
    icon.textContent = 'check';
    text.textContent = 'Copied to clipboard';
    setTimeout(() => {
      icon.textContent = 'content_copy';
      text.textContent = 'Copy answer';
    }, 2200);
  }
</script></main></div>
